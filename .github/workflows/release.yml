name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $appVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $appVersion) { throw "Tag v$tagVersion does not match package.json version $appVersion" }
      - name: Install dependencies
        run: npm ci
      - name: Build installer and publish GitHub Release assets
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and upload installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$repository/releases/tags/$tag"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          $installer = Get-ChildItem -Path dist -Filter "AlawaSystem-Setup-*.exe" -File | Select-Object -First 1
          $metadata = Get-Item -Path "dist/latest.yml" -ErrorAction SilentlyContinue
          if (-not $installer -or -not $metadata) { throw "Installer or latest.yml was not produced in dist/." }
          foreach ($file in @($installer, $metadata)) {
            if ($release.assets.name -contains $file.Name) { continue }
            $assetName = [uri]::EscapeDataString($file.Name)
            $uploadUrl = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets?name=$assetName"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -InFile $file.FullName -ContentType "application/octet-stream" | Out-Null
          }
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          $required = @($installer.Name, $metadata.Name)
          foreach ($name in $required) {
            if ($release.assets.name -notcontains $name) { throw "Required release asset is missing: $name" }
          }
