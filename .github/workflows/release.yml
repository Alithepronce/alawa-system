name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $appVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $appVersion) { throw "Tag v$tagVersion does not match package.json version $appVersion" }
      - name: Install dependencies
        run: npm ci
      - name: Build installer and publish GitHub Release assets
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
