name: Build and publish Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify release tag matches app version
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}".TrimStart('v')
          $appVersion = node -p "require('./package.json').version"
          if ($tagVersion -ne $appVersion) { throw "Tag v$tagVersion does not match package.json version $appVersion" }
      - name: Install dependencies
        run: npm ci
      - name: Build installer and publish GitHub Release assets
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify and upload installer and update metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $repository = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $releaseUrl = "https://api.github.com/repos/$repository/releases/tags/$tag"
          try { $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers }
          catch {
            $releaseBody = @{ tag_name = $tag; name = "Alawa System $tag"; draft = $false; prerelease = $false } | ConvertTo-Json
            $release = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$repository/releases" -Headers $headers -Body $releaseBody -ContentType "application/json"
          }
          $installer = Get-ChildItem -Path dist -File | Where-Object { $_.Name -like "*Setup*.exe" -and $_.Name -notlike "*uninstaller*" } | Select-Object -First 1
          $blockmap = Get-ChildItem -Path dist -Filter "*.exe.blockmap" -File | Select-Object -First 1
          if (-not $installer -or -not $blockmap) { throw "NSIS installer or blockmap was not produced in dist/." }
          $assetInstaller = "AlawaSystem-Setup-$($tag.TrimStart('v')).exe"
          $hash = [Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes($installer.FullName)))
          $metadata = @"
          version: $($tag.TrimStart('v'))
          files:
            - url: $assetInstaller
              sha512: $hash
              size: $($installer.Length)
          path: $assetInstaller
          sha512: $hash
          releaseDate: '$(Get-Date -Format "yyyy-MM-ddTHH:mm:ss.fffZ" -AsUTC)'
          "@
          $metadataPath = Join-Path (Resolve-Path dist) "latest.yml"
          [IO.File]::WriteAllText($metadataPath, $metadata, [Text.UTF8Encoding]::new($false))
          $assetsToUpload = @(
            @{ File = $installer; Name = $assetInstaller },
            @{ File = $blockmap; Name = "$assetInstaller.blockmap" },
            @{ File = Get-Item $metadataPath; Name = "latest.yml" }
          )
          foreach ($asset in $assetsToUpload) {
            if ($release.assets.name -contains $asset.Name) { continue }
            $assetName = [uri]::EscapeDataString($asset.Name)
            $uploadUrl = "https://uploads.github.com/repos/$repository/releases/$($release.id)/assets?name=$assetName"
            Invoke-RestMethod -Method Post -Uri $uploadUrl -Headers $headers -InFile $asset.File.FullName -ContentType "application/octet-stream" | Out-Null
          }
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers $headers
          $required = @($assetInstaller, "$assetInstaller.blockmap", "latest.yml")
          foreach ($name in $required) {
            if ($release.assets.name -notcontains $name) { throw "Required release asset is missing: $name" }
          }
