<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    
    <!-- Gold / Wheat Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <!-- Sage / Agriculture Gradient -->
    <linearGradient id="sageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Terracotta Accent Gradient -->
    <linearGradient id="terraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#C4714A"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="488" height="488" rx="100" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.6"/>

  <!-- Inner Subtle Halo -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="2"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="6,6"/>

  <!-- Group with Shadow Filter -->
  <g filter="url(#glow)">
    
    <!-- Central Scales Pillar (Zimam Anchor) -->
    <path d="M250 110 L262 110 L260 380 L252 380 Z" fill="#E2E8F0"/>
    <circle cx="256" cy="100" r="14" fill="url(#goldGrad)"/>
    <circle cx="256" cy="100" r="6" fill="#1E293B"/>

    <!-- Scales Beam -->
    <path d="M120 186 C180 178 332 178 392 186" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
    <circle cx="256" cy="182" r="10" fill="url(#goldGrad)"/>

    <!-- Left Scale (Chains & Pan) -->
    <line x1="130" y1="188" x2="96" y2="280" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="130" y1="188" x2="164" y2="280" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M84 280 C84 316 176 316 176 280 Z" fill="url(#sageGrad)"/>
    <ellipse cx="130" cy="280" rx="46" ry="6" fill="#6EE7B7"/>

    <!-- Right Scale (Chains & Pan) -->
    <line x1="382" y1="188" x2="348" y2="280" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <line x1="382" y1="188" x2="416" y2="280" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
    <path d="M336 280 C336 316 428 316 428 280 Z" fill="url(#sageGrad)"/>
    <ellipse cx="382" cy="280" rx="46" ry="6" fill="#6EE7B7"/>

    <!-- Wheat Ears (Left Side) -->
    <g transform="translate(130, 240) rotate(-18)">
      <path d="M0 0 C-12 -18 -8 -36 0 -48 C8 -36 12 -18 0 0 Z" fill="url(#goldGrad)"/>
      <path d="M-10 -20 C-26 -28 -24 -46 -14 -56 C-6 -46 -4 -28 -10 -20 Z" fill="url(#goldGrad)"/>
      <path d="M10 -20 C26 -28 24 -46 14 -56 C6 -46 4 -28 10 -20 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Wheat Ears (Right Side) -->
    <g transform="translate(382, 240) rotate(18)">
      <path d="M0 0 C-12 -18 -8 -36 0 -48 C8 -36 12 -18 0 0 Z" fill="url(#goldGrad)"/>
      <path d="M-10 -20 C-26 -28 -24 -46 -14 -56 C-6 -46 -4 -28 -10 -20 Z" fill="url(#goldGrad)"/>
      <path d="M10 -20 C26 -28 24 -46 14 -56 C6 -46 4 -28 10 -20 Z" fill="url(#goldGrad)"/>
    </g>

    <!-- Scales Base Pedestal -->
    <path d="M196 380 L316 380 L336 414 L176 414 Z" fill="url(#terraGrad)"/>
    <rect x="160" y="414" width="192" height="14" rx="7" fill="#E2E8F0"/>

    <!-- Central Zimam Emblem (Geometric Diamond Hub) -->
    <polygon points="256,236 278,266 256,296 234,266" fill="url(#goldGrad)"/>
    <circle cx="256" cy="266" r="6" fill="#1E293B"/>

  </g>
</svg>
